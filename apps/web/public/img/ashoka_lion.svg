<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <!-- Ashoka Lion Capital Emblem of India -->
  <!-- Top Lions -->
  <g fill="#1e3a8a">
    <!-- Center Lion -->
    <path d="M 50,12 C 40,12 36,25 36,40 C 36,48 42,54 50,54 C 58,54 64,48 64,40 C 64,25 60,12 50,12 Z"/>
    <circle cx="45" cy="30" r="2.5" fill="#ffffff"/>
    <circle cx="55" cy="30" r="2.5" fill="#ffffff"/>
    <circle cx="45" cy="30" r="1.2" fill="#1e3a8a"/>
    <circle cx="55" cy="30" r="1.2" fill="#1e3a8a"/>
    <path d="M 47,38 L 53,38 L 50,42 Z" fill="#ffffff"/>
    <!-- Center Lion Mane Details -->
    <path d="M 38,28 C 32,32 32,45 38,50 Z" fill="#1e40af"/>
    <path d="M 62,28 C 68,32 68,45 62,50 Z" fill="#1e40af"/>

    <!-- Left Lion (Profile) -->
    <path d="M 36,25 C 28,26 22,34 22,44 C 22,50 28,54 36,54 Z"/>
    <circle cx="28" cy="36" r="1.8" fill="#ffffff"/>

    <!-- Right Lion (Profile) -->
    <path d="M 64,25 C 72,26 78,34 78,44 C 78,50 72,54 64,54 Z"/>
    <circle cx="72" cy="36" r="1.8" fill="#ffffff"/>

    <!-- Pillars / Body -->
    <path d="M 34,54 L 66,54 L 64,72 L 36,72 Z" fill="#1e3a8a"/>

    <!-- Abacus Base -->
    <rect x="20" y="72" width="60" height="12" rx="2" fill="#1e3a8a"/>

    <!-- Ashoka Chakra (24-spoke wheel) on Abacus -->
    <circle cx="50" cy="78" r="5" fill="#ffffff"/>
    <circle cx="50" cy="78" r="4" fill="none" stroke="#1e3a8a" stroke-width="0.8"/>
    <circle cx="50" cy="78" r="1.2" fill="#1e3a8a"/>

    <!-- Galloping Horse (Left) & Bull (Right) on Abacus -->
    <path d="M 28,78 C 26,75 24,76 22,78 Z" stroke="#ffffff" stroke-width="1.2" fill="none"/>
    <path d="M 72,78 C 74,75 76,76 78,78 Z" stroke="#ffffff" stroke-width="1.2" fill="none"/>

    <!-- Bell-shaped Inverted Lotus Base -->
    <path d="M 24,84 C 28,94 40,98 50,98 C 60,98 72,94 76,84 Z" fill="#1e40af"/>

    <!-- Pedestal Base Plate -->
    <rect x="18" y="98" width="64" height="4" rx="1" fill="#1e3a8a"/>
  </g>
  <!-- Motto: Satyameva Jayate (Devanagari text representation) -->
  <text x="50" y="112" font-family="'Noto Sans', 'Arial', sans-serif" font-size="7.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle" letter-spacing="0.5">
    सत्यमेव जयते
  </text>
</svg>
